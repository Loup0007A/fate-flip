plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// La version du mod est commune à toutes les cibles (gradle.properties à la racine)
def common = new Properties()
file('../../gradle.properties').withInputStream { common.load(it) }
version = common.mod_version
group = 'com.fateflip'
base { archivesName = 'fateflip' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Sources produites par « python3 tools/port.py neoforge-1.21.1 »
sourceSets.main.java.srcDirs = ['build/ported/java']
sourceSets.main.resources.srcDirs = ['build/ported/resources']

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        fateflip { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '1000'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand 'version': project.version }
}

jar { archiveClassifier = project.target_name }

// Copie le classpath de compilation (pour compiler localement sans accès aux dépôts Maven)
tasks.register('exportLibs', Copy) {
    from configurations.compileClasspath
    from(layout.buildDirectory.dir('moddev/artifacts'))
    into layout.buildDirectory.dir('export')
}
