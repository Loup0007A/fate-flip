plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

def common = new Properties()
file('../../gradle.properties').withInputStream { common.load(it) }
version = common.mod_version
group = 'com.fateflip'
base { archivesName = 'fateflip' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Sources produites par « python3 tools/port.py forge-1.20.1 »
sourceSets.main.java.srcDirs = ['build/ported/java']
sourceSets.main.resources.srcDirs = ['build/ported/resources']

minecraft {
    mappings channel: 'parchment', version: project.parchment_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            mods { fateflip { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '1000'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

jar {
    archiveClassifier = project.target_name
    finalizedBy 'reobfJar'
}

// Classpath de compilation + table de correspondance noms lisibles -> SRG (pour la réflexion)
tasks.register('exportLibs', Copy) {
    dependsOn 'createMcpToSrg'
    from configurations.compileClasspath
    from(layout.buildDirectory.dir('createMcpToSrg'))
    into layout.buildDirectory.dir('export')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
