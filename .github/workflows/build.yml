name: Build Fate Flip

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ 'releases/**', 'curseforge/**', '*.md' ]
  workflow_dispatch:
    inputs:
      publish_curseforge:
        description: "Forcer l'envoi de la version actuelle sur CurseForge (main uniquement)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref_name != 'ci-logs'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build mod
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Self-test (real Forge server + real client with screenshots)
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          JAR="$PWD/build/libs/fateflip-${VERSION}.jar"
          FORGE=1.21.1-52.0.7
          # ---- Serveur (met en scène un décor pour les captures) ----
          mkdir -p srv && cd srv
          curl -sSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
          java -jar installer.jar --installServer . > installer.log 2>&1 || (tail -30 installer.log; exit 1)
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-seed=fateflip\ngamemode=creative\nspawn-monsters=false\n' > server.properties
          mkdir -p mods && cp "$JAR" mods/
          printf -- '-Dfateflip.selftest=true\n' >> user_jvm_args.txt
          chmod +x run.sh
          (timeout 1500 ./run.sh nogui < /dev/null > ../selftest.log 2>&1; echo "server exit $?" >> ../selftest.log) &
          cd ..
          for i in $(seq 1 120); do grep -q "SELFTEST\] READY" selftest.log && break; sleep 5; done
          grep -E "\[SELFTEST\]|Exception|ERROR" selftest.log | head -100 > selftest-summary.log || true
          cat selftest-summary.log
          # ---- Client (portablemc + Xvfb, rendu logiciel) — hors main, pour garder la release rapide ----
          set +e
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          pip install -q portablemc==5.0.6
          mkdir -p client/mods && cp "$JAR" client/mods/
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\nsoundCategory_master:0.0\nnarrator:0\nguiScale:3\nskipMultiplayerWarning:true\njoinedFirstServer:true\nrenderDistance:8\n' > client/options.txt
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" timeout 1500 \
            portablemc --main-dir "$PWD/mcmain" start --mc-dir "$PWD/client" "forge::${FORGE}" \
            -u Tester --join-server 127.0.0.1 --resolution 1280x720 \
            --jvm-arg=-Xmx3G,-Dfateflip.clienttest=true > clienttest.log 2>&1
          echo "client exit $?"
          grep -E "CLIENTTEST|FateFlip|Exception|ERROR|GL error|shader" clienttest.log | head -200
          grep -q "CLIENTTEST\] RESULT" clienttest.log || tail -60 clienttest.log
          ls -la client/screenshots
          fi
          pkill -f "nogui" || true
          wait
          set -e
          grep -q "\[SELFTEST\] READY" selftest.log
          if [ "${GITHUB_REF_NAME}" != "main" ]; then grep -q "\[CLIENTTEST\] RESULT: OK" clienttest.log; fi

      - name: Publish logs and screenshots to the ci-logs branch
        if: always()
        run: |
          NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '_')
          mkdir -p /tmp/logs
          cp build.log "/tmp/logs/${NAME}.log" 2>/dev/null || echo "no log" > "/tmp/logs/${NAME}.log"
          cp selftest.log "/tmp/logs/${NAME}.selftest.log" 2>/dev/null || true
          cp clienttest.log "/tmp/logs/${NAME}.clienttest.log" 2>/dev/null || true
          mkdir -p "/tmp/logs/screenshots/${NAME}" && cp client/screenshots/*.png "/tmp/logs/screenshots/${NAME}/" 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > "/tmp/logs/${NAME}.status"
          ls -l build/libs >> "/tmp/logs/${NAME}.status" 2>/dev/null || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A && git commit -qm "logs ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fateflip-jar
          path: build/libs/fateflip-*.jar
          if-no-files-found: error

      - name: Publish release and commit the jar (main only)
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          JAR="build/libs/fateflip-${VERSION}.jar"
          ls -l "$JAR"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # 1) Release GitHub (créée ou mise à jour). Une nouvelle version = nouvel envoi CurseForge.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$JAR" --clobber
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            awk -v v="## ${VERSION}" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > release-notes.md
            [ -s release-notes.md ] || cp CHANGELOG.md release-notes.md
            gh release create "v${VERSION}" "$JAR" --title "Fate Flip ${VERSION}" \
              --notes-file release-notes.md --target "${GITHUB_SHA}"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          # 2) Copie du jar dans le dépôt (dossier releases/)
          mkdir -p releases
          cp "$JAR" releases/
          cp "$JAR" releases/fateflip-latest.jar
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add releases/
          if ! git diff --cached --quiet; then
            git commit -qm "Jar compilé ${VERSION} (${GITHUB_SHA::7})"
            git push -q origin HEAD:main
          fi

      - name: Upload to CurseForge (new version on main, needs CURSEFORGE_TOKEN + CURSEFORGE_PROJECT_ID)
        if: >-
          github.ref == 'refs/heads/main' &&
          (steps.release.outputs.new == 'true' || inputs.publish_curseforge)
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_PROJECT" ]; then
            echo "::notice::CurseForge ignoré : ajoutez le secret CURSEFORGE_TOKEN et la variable CURSEFORGE_PROJECT_ID (voir curseforge/SETUP.md)."
            exit 0
          fi
          bash curseforge/upload.sh "build/libs/fateflip-${VERSION}.jar" "$VERSION"
