name: Build Fate Flip

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ 'releases/**', 'curseforge/**', '*.md' ]
  workflow_dispatch:
    inputs:
      publish_curseforge:
        description: "Forcer l'envoi de la version actuelle sur CurseForge (main uniquement)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ─────────────── 1. Un jar par cible (version de Minecraft + loader) ───────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    if: github.ref_name != 'ci-logs' && !startsWith(github.ref_name, 'mc-libs-')
    strategy:
      fail-fast: false
      matrix:
        target: [ forge-1.21.1, neoforge-1.21.1, forge-1.20.1, neoforge-26.3 ]
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 / 25 / 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.target }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'targets/*/gradle.properties') }}
          restore-keys: gradle-${{ matrix.target }}-

      - name: Build
        env:
          T: ${{ matrix.target }}
        run: |
          set -o pipefail
          V=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          chmod +x gradlew targets/*/gradlew 2>/dev/null || true
          mkdir -p out
          if [ "$T" = "forge-1.21.1" ]; then
            # La variante de référence : les sources de src/main, telles quelles
            ./gradlew build --no-daemon 2>&1 | tee "out/build-$T.log"
            cp "build/libs/fateflip-$V.jar" "out/fateflip-$V-$T.jar"
          else
            python3 tools/port.py "$T"
            cd "targets/$T"
            if [ -x ./gradlew ]; then G=./gradlew; else G=../../gradlew; fi
            $G build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
              2>&1 | tee "../../out/build-$T.log"
            cd ../..
            cp "targets/$T/build/libs/fateflip-$V-$T.jar" out/
          fi
          ls -l out
        # Gradle 9 (cibles NeoForge) demande de lancer Gradle avec Java 17+ ; Forge 1.21.1 compile en 21
        shell: bash

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: out/*.jar
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.target }}
          path: out/*.log

  # ─────────────── 2. Test en jeu : vrai serveur + vrai client, captures de chaque carte ───────────────
  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: forge-1.21.1,    target: forge-1.21.1,    loader: forge,    loader_version: 1.21.1-52.0.7 }
          - { name: forge-1.21,      target: forge-1.21.1,    loader: forge,    loader_version: 1.21-51.0.33 }
          - { name: neoforge-1.21.1, target: neoforge-1.21.1, loader: neoforge, loader_version: 21.1.265 }
          - { name: forge-1.20.1,    target: forge-1.20.1,    loader: forge,    loader_version: 1.20.1-47.4.23 }
          - { name: neoforge-26.3,   target: neoforge-26.3,   loader: neoforge, loader_version: 26.3.0.101, java: 25, backend: opengl }
          - { name: neoforge-26.3-vulkan, target: neoforge-26.3, loader: neoforge, loader_version: 26.3.0.101, java: 25, backend: vulkan }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java || 21 }}

      - uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: out

      - name: Client et serveur de test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils mesa-vulkan-drivers libvulkan1 > /dev/null
          pip install -q portablemc==5.0.6
          BACKEND="${{ matrix.backend }}" bash tools/ci_test.sh out/*.jar "${{ matrix.loader }}" "${{ matrix.loader_version }}" "${{ matrix.name }}"

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.name }}
          path: ci-out/${{ matrix.name }}

  # ─────────────── 3. Journaux et captures sur la branche ci-logs ───────────────
  logs:
    name: Publish logs
    runs-on: ubuntu-latest
    needs: [ build, test ]
    if: always() && github.ref_name != 'ci-logs' && !startsWith(github.ref_name, 'mc-libs-')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Push to ci-logs
        run: |
          NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '_')
          mkdir -p "/tmp/logs/$NAME"
          for d in all/test-*; do [ -d "$d" ] && cp -r "$d" "/tmp/logs/$NAME/${d#all/test-}"; done
          for d in all/buildlog-*; do [ -d "$d" ] && cp "$d"/*.log "/tmp/logs/$NAME/" 2>/dev/null; done
          {
            echo "build: ${{ needs.build.result }}  test: ${{ needs.test.result }}  ${GITHUB_SHA}"
            for f in /tmp/logs/$NAME/*/clienttest.log; do [ -f "$f" ] && echo "$(basename $(dirname $f)): $(grep -o 'RESULT: .*' "$f" | tail -1)"; done
          } > "/tmp/logs/$NAME/status.txt"
          cat "/tmp/logs/$NAME/status.txt"
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A && git commit -qm "logs ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  # ─────────────── 4. Release GitHub + jars dans releases/ + CurseForge (main seulement) ───────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ build, test ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: out
          merge-multiple: true

      - name: Publish release and commit the jars
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -l out
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" out/*.jar --clobber
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            awk -v v="## ${VERSION}" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > release-notes.md
            [ -s release-notes.md ] || cp CHANGELOG.md release-notes.md
            gh release create "v${VERSION}" out/*.jar --title "Fate Flip ${VERSION}" \
              --notes-file release-notes.md --target "${GITHUB_SHA}"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p releases
          for j in out/*.jar; do
            cp "$j" releases/
            T=$(basename "$j" .jar | sed "s/^fateflip-${VERSION}-//")
            cp "$j" "releases/fateflip-latest-$T.jar"
          done
          cp "out/fateflip-${VERSION}-forge-1.21.1.jar" releases/fateflip-latest.jar
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add releases/
          if ! git diff --cached --quiet; then
            git commit -qm "Jars compilés ${VERSION} (${GITHUB_SHA::7})"
            git pull -q --rebase origin main || true
            git push -q origin HEAD:main
          fi

      - name: Upload to CurseForge (new version, needs CURSEFORGE_TOKEN + CURSEFORGE_PROJECT_ID)
        if: steps.release.outputs.new == 'true' || inputs.publish_curseforge
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
          V: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_PROJECT" ]; then
            echo "::notice::CurseForge ignoré : ajoutez le secret CURSEFORGE_TOKEN et la variable CURSEFORGE_PROJECT_ID (voir curseforge/SETUP.md)."
            exit 0
          fi
          FAIL=0
          bash curseforge/upload.sh "out/fateflip-$V-forge-1.21.1.jar" "$V" "Fate Flip $V (Forge 1.21–1.21.1)" "1.21,1.21.1" "Forge" "Java 21" || FAIL=1
          bash curseforge/upload.sh "out/fateflip-$V-neoforge-1.21.1.jar" "$V" "Fate Flip $V (NeoForge 1.21–1.21.1)" "1.21,1.21.1" "NeoForge" "Java 21" || FAIL=1
          bash curseforge/upload.sh "out/fateflip-$V-forge-1.20.1.jar" "$V" "Fate Flip $V (Forge 1.20.1)" "1.20.1" "Forge" "Java 17" || FAIL=1
          bash curseforge/upload.sh "out/fateflip-$V-neoforge-26.3.jar" "$V" "Fate Flip $V (NeoForge 26.3)" "26.3" "NeoForge" "Java 25" || FAIL=1
          exit $FAIL
